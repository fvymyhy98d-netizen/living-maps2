name: 云存档保活（防 Supabase 把免费项目暂停）

# Supabase 免费版会暂停「一周内几乎没有数据库活动」的项目：
#   "Typically a few user requests to the database each day over the previous week
#    is enough to keep the project from being paused."  —— Project Pausing 文档
# 暂停后页面还能看，但云存档写不进也读不到，要手动 Resume。
# 这里每天只发 2 个**只读**请求（每表一条 `?select=id&limit=1`），
# 不写数据、不留垃圾行 —— 比「定时发一条再删掉」干净得多。

on:
  schedule:
    # 每天两次（UTC 03:17 / 15:17 = 北京 11:17 / 23:17），免得单次失败就断档
    - cron: '17 3,15 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: ping supabase
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 读取 data/content.js 里的云存档配置并各发一条只读请求
        run: node tools/keepalive.js
