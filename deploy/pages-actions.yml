# =========================================================
#  可选：用 GitHub Actions 发布 GitHub Pages（模板，不会自动生效）
#  为什么要有它：官方口径「GitHub Pages 站点有每小时 10 次构建的软限制；
#  用自定义 GitHub Actions 工作流构建和发布时，此限制不适用」。
#
#  ★ 修复89 起，协同内容改写到独立的数据分支（默认 lm-data）——**不进 main、
#    也不触发任何构建**；main 上的 data/content.js 只是「首屏快照」（≤1 次 / 30 分钟，
#    最多 2 次构建/小时）。所以本模板已经不是必需的，它的作用是「再上一层保险」：
#    连代码提交也不再受 10 次/小时软限约束（一天连发十几个版本也不会互相顶掉）。
#
#  ⚠ 快照要能被新访客看到，就必须让 data/content.js 的提交照常部署 ——
#    所以下面的 paths-ignore **不要**再把 data/content.js 挡掉。
#
#  启用三步（约 5 分钟，可回退）：
#    ① 把本文件移动到 .github/workflows/pages.yml
#    ② 仓库 Settings → Pages → Source 改成 “GitHub Actions”
#       （改完之后，原来「Deploy from a branch」的分支发布自动停用）
#    ③ 随便改一行代码提交，确认 Actions 里 pages 工作流变绿、站点正常
#  回退：删掉 .github/workflows/pages.yml，把 Source 改回
#        “Deploy from a branch” → main → / (root) 即可。
# =========================================================
name: pages

on:
  push:
    branches: [main]
    # 纯文档 / 模板文件的提交不必重新发布（内容提交不在此列：快照需要部署）
    paths-ignore:
      - 'README.md'
      - 'deploy/**'
  workflow_dispatch:   # 允许在 Actions 页面手动点一次「Run workflow」重新发布

# 最小权限：读仓库 + 写 Pages + 取 OIDC 令牌（deploy-pages 需要）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署；不取消进行中的（避免把正在发布的站点打断成 404）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      # 只打包站点需要的文件（node_modules 已被 .gitignore 排除，测试脚本不进产物）
      - name: 收集站点文件到 _site
        run: |
          mkdir -p _site
          cp -r index.html css js lib data images _site/
          echo "打包内容：" && ls -1 _site

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: 部署到 Pages
        id: deploy
        uses: actions/deploy-pages@v4
