<!-- 安全加固：内容安全策略（CSP）。脚本只许本站文件（Yjs 三件套已本地化到 lib/，零 CDN 依赖）；
     样式允许内联（编辑器大量使用 style 属性）；图片允许任意来源（用户可贴外链图）+ data:（粘贴 base64）；
     网络请求只许本站、GitHub API（云协同提交/轮询）、raw.githubusercontent（访客云端只读轮询）、
     wss: 与 CloudBase 网关（腾讯云信令，只传握手不传内容）、以及「云存档」白名单
     （★ 修复96：Supabase / 自建 Worker / 飞书·钉钉·企业微信群机器人 —— 只加域名，不加通配 https:）；
     禁止插件/iframe/表单外提交/基址劫持。注意：Live Server 的自动刷新脚本会被拦截（属正常），手动 Ctrl+Shift+R 即可 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src 'self' https://api.github.com https://raw.githubusercontent.com https://*.supabase.co https://*.workers.dev https://open.feishu.cn https://oapi.dingtalk.com https://qyapi.weixin.qq.com wss:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
