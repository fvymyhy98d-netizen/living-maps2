<!-- 安全加固：内容安全策略（CSP）。脚本只许本站文件（Yjs 三件套已本地化到 lib/，零 CDN 依赖）；
     样式允许内联（编辑器大量使用 style 属性）；图片允许任意来源（用户可贴外链图）+ data:（粘贴 base64）；

     wss: 与 CloudBase 网关（腾讯云信令，只传握手不传内容）、以及「云存档」白名单

     禁止插件/iframe/表单外提交/基址劫持。注意：Live Server 的自动刷新脚本会被拦截（属正常），手动 Ctrl+Shift+R 即可 -->

<!-- ★ 修复143：首屏「正在加载」层 —— 纯内联 CSS + 系统 emoji（🐶🐱🐰🦊 在路上蹦跳），
     不依赖任何外链资源/脚本，也不碰 CSP（内联 <style> 在 style-src 白名单里）。
     脚本全部下载并完成首次 render() 后由 app.js 调 hideBootLoader() 平滑淡出。
     另外带一条 16s 的 CSS 兜底：万一脚本异常，也不会把页面永远罩住。 -->
<style>
#bootLoader{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 90% at 50% 0%,#eef4ff 0%,#ffffff 46%,#fff6f0 100%);
  transition:opacity .5s ease,visibility .5s ease;animation:blSafety .01s linear 16s forwards}
#bootLoader.done{opacity:0;visibility:hidden;pointer-events:none}
@keyframes blSafety{to{opacity:0;visibility:hidden;pointer-events:none}}
.bl-inner{display:flex;flex-direction:column;align-items:center;gap:9px;padding:0 24px;max-width:430px;width:100%;text-align:center;animation:blIn .6s cubic-bezier(.16,1,.3,1)}
@keyframes blIn{from{opacity:0;transform:translateY(16px)}}
.bl-ico{font-size:54px;line-height:1;animation:blFloat 3.4s ease-in-out infinite;filter:drop-shadow(0 10px 20px rgba(0,113,227,.18))}
@keyframes blFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.bl-title{font-size:27px;font-weight:700;letter-spacing:-.02em;
  background:linear-gradient(94deg,#0090f7 0%,#6a5df9 38%,#e64ac0 72%,#f5a623 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.bl-sub{font-size:14px;color:#86868b}
.bl-road{position:relative;width:320px;max-width:82vw;height:76px;margin-top:6px;overflow:hidden}
.bl-ground{position:absolute;left:0;right:0;bottom:10px;height:2px;border-radius:2px;
  background:repeating-linear-gradient(90deg,#d6d6db 0 10px,transparent 10px 20px);
  animation:blRoad .72s linear infinite}
@keyframes blRoad{from{background-position-x:0}to{background-position-x:20px}}
.bl-run{position:absolute;bottom:12px;width:36px;height:46px;display:flex;flex-direction:column;align-items:center;
  --d:0s;animation:blHop .9s cubic-bezier(.34,1.56,.64,1) var(--d) infinite}
.bl-run .be{font-size:30px;line-height:1;transform-origin:50% 100%}
.bl-run .bs{width:22px;height:6px;border-radius:50%;background:rgba(29,29,31,.15);margin-top:3px;
  animation:blShadow .9s cubic-bezier(.34,1.56,.64,1) var(--d) infinite}
.bl-run.r1{left:2%;--d:0s}
.bl-run.r2{left:29%;--d:.24s}
.bl-run.r3{left:56%;--d:.48s}
.bl-run.r4{left:82%;--d:.12s}
@keyframes blHop{0%,100%{transform:translateY(0)}50%{transform:translateY(-17px)}}
@keyframes blShadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.5);opacity:.5}}
.bl-dot{position:absolute;bottom:16px;width:5px;height:5px;border-radius:50%;background:rgba(0,113,227,.28);animation:blDrift 3.2s linear infinite}
.bl-dot.d1{left:100%;animation-delay:0s}
.bl-dot.d2{left:100%;animation-delay:1.1s}
.bl-dot.d3{left:100%;animation-delay:2.2s}
@keyframes blDrift{0%{transform:translateX(0);opacity:0}12%{opacity:1}100%{transform:translateX(-380px);opacity:0}}
.bl-dots{display:flex;gap:6px;margin-top:3px}
.bl-dots i{width:7px;height:7px;border-radius:50%;background:#0071e3;animation:blDot 1.2s ease-in-out infinite}
.bl-dots i:nth-child(2){animation-delay:.18s}
.bl-dots i:nth-child(3){animation-delay:.36s}
@keyframes blDot{0%,100%{opacity:.22;transform:translateY(0)}50%{opacity:1;transform:translateY(-5px)}}
.bl-tip{margin-top:3px;font-size:12px;color:#aeaeb2}
@media (prefers-reduced-motion:reduce){
  #bootLoader,#bootLoader *{animation:none !important;transition:none !important}
}
</style>
